name: Build Frontend Assets

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'resources/react-builder/**'
      - '.github/workflows/build-frontend.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: resources/react-builder/package-lock.json

      - name: Install dependencies
        working-directory: resources/react-builder
        run: npm ci

      - name: Build frontend
        working-directory: resources/react-builder
        run: npm run build:prod

      - name: Check for changes
        id: check_changes
        run: |
          git add public/admin/
          git add resources/views/admin.blade.php
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push build files
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git commit -m "🤖 Auto-build frontend assets [skip ci]"
          git push

      - name: No changes detected
        if: steps.check_changes.outputs.has_changes == 'false'
        run: echo "No build changes detected - skipping commit"
